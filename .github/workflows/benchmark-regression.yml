name: Benchmark Regression Check

on:
  pull_request:
    # Docs-only PRs skip this workflow. The list is a copy of DOCS_ONLY in
    # scripts/ci-changed-paths.sh, which ci.yml uses to skip its build and test
    # jobs; change both together. A path listed here but not there would skip
    # the benchmarks on a change that could affect them.
    paths-ignore:
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  criterion-benchmarks:
    runs-on: ubuntu-latest
    # Skip for PRs from forks so external contributors can't auto-trigger
    # benchmarks. First-party branches only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            benchmarks

      - name: Discard any cached criterion state
        # A cache hit brings back benchmarks/target with target/criterion in a
        # half state: the per-benchmark base directory is there but the
        # sample.json inside it is not. Criterion takes the directory alone as
        # a baseline to compare against, fails to read it, and prints the error
        # to stdout in the middle of the result line it was writing, leaving
        # the comparison below nothing to parse. The baseline this job wants
        # comes from the benchmark-data branch, so criterion's own on-disk one
        # is only ever leftovers from an unrelated PR.
        run: rm -rf benchmarks/target/criterion

      - name: Run criterion micro-benchmarks
        # shell: bash adds -o pipefail. Without it the exit status of the pipe
        # is tee's, so a bench that dies partway leaves a truncated file and
        # still reports success.
        shell: bash
        run: cd benchmarks && cargo bench --bench embedded_micro -- --output-format bencher | tee criterion_output.txt

      - name: Compare against recent baselines
        id: compare
        run: |
          git fetch origin benchmark-data:benchmark-data 2>/dev/null || true

          set +e
          python3 benchmarks/scripts/compare_criterion.py \
            --current-output benchmarks/criterion_output.txt \
            --output comparison.md 2> compare_stderr.txt
          status=$?
          set -e
          cat compare_stderr.txt

          # Exit 3 means a benchmark came in over the threshold. That is
          # advisory: the step stays green and the warning is the whole signal,
          # because wall-clock timings on shared runners move on their own.
          #
          # Exit 4 means the run lost benchmarks. It fails the step, but the
          # comparison it wrote covers the ones that survived and names the
          # ones that did not, so keep that file rather than replacing it with
          # the error block below.
          if [ "$status" -eq 4 ]; then
            echo "regressed=false" >> "$GITHUB_OUTPUT"
            echo "::error::criterion run produced no result for some benchmarks"
            exit "$status"
          fi

          # Any other non-zero means no comparison happened at all. That fails
          # the step, since a check that could not run must not look like one
          # that passed. It still does not block merge: this job is not a
          # required check, and neither is the iai-callgrind job.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            {
              echo "## Criterion Benchmark Results"
              echo
              echo "> :x: The comparison could not be made (exit ${status}), so this"
              echo "> run says nothing about performance either way."
              echo
              echo '```'
              cat compare_stderr.txt
              echo '```'
            } > comparison.md
            echo "regressed=false" >> "$GITHUB_OUTPUT"
            echo "::error::criterion comparison failed (exit $status)"
            exit "$status"
          fi

          if [ "$status" -eq 3 ]; then
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          else
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post comparison to the PR
        # always(), so a failed comparison still carries its reason into the PR
        # rather than leaving a red check with nothing to explain it.
        if: always()
        uses: actions/github-script@v8
        env:
          REGRESSED: ${{ steps.compare.outputs.regressed }}
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('comparison.md', 'utf8');
            } catch {
              body = '## Criterion Benchmark Results\n\n'
                   + '> :x: The benchmark job did not get as far as producing a '
                   + 'comparison. See the run log.\n';
            }

            // GITHUB_STEP_SUMMARY is always visible in the Actions tab
            await core.summary.addRaw(body).write();

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

            // A threshold breach is advisory and never blocks merge
            if (process.env.REGRESSED === 'true') {
              core.warning('Wall-clock regression detected -- see PR comment for details');
            }

  iai-benchmarks:
    runs-on: ubuntu-latest
    # Skip for PRs from forks so external contributors can't auto-trigger
    # benchmarks. First-party branches only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull_request run checks out the merge commit. Depth 2 brings its
          # first parent too, the tip of the branch the PR merges into, which
          # is the baseline: it holds everything the merge commit has except
          # this PR's change. The merge base would not do, since it would
          # blame the PR for whatever reached the base branch after it forked.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            benchmarks

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Install iai-callgrind-runner
        run: |
          IAI_VERSION=$(cd benchmarks && cargo metadata --format-version=1 --no-deps | python3 -c "
          import json, sys
          meta = json.load(sys.stdin)
          for pkg in meta['packages']:
              for dep in pkg.get('dependencies', []):
                  if dep['name'] == 'iai-callgrind':
                      req = dep['req']
                      if not req.startswith(('^', '~', '=')):
                          req = '^' + req
                      print(req)
                      sys.exit(0)
          print('^0.14')
          ")
          cargo install iai-callgrind-runner --version "${IAI_VERSION}"

      - name: Discard any cached iai-callgrind state
        # Same reason as the criterion job's: a cache hit brings back
        # target/iai from an unrelated PR. Its files would sit in as a baseline
        # wherever the base run fails to write one, and a run without a
        # comparison would compare against them silently. So this runs every
        # time, before anything is benchmarked.
        run: rm -rf benchmarks/target/iai

      - name: Compare the iai-callgrind version with the base
        # The runner refuses a library of any other version, and it is
        # installed from the PR's requirement, so when a PR changes the locked
        # iai-callgrind the base cannot be benchmarked with it. Counts from two
        # versions are not comparable either. That is the one case with no
        # comparison: say so and run the PR's benchmarks on their own.
        #
        # Only a version read from both sides, and different, skips the
        # comparison. One that cannot be read fails the job, so a lock file
        # this step cannot parse never turns the check off.
        id: version
        shell: bash
        run: |
          locked() {
            git show "$1:benchmarks/Cargo.lock" \
              | sed -n '/^name = "iai-callgrind"$/{n;s/^version = "\(.*\)"$/\1/p;}'
          }
          base_version=$(locked HEAD^1) || base_version=
          head_version=$(locked HEAD) || head_version=
          for side in base head; do
            version_var="${side}_version"
            if [ -z "${!version_var}" ]; then
              echo "::error::Could not read the locked iai-callgrind version from the ${side} commit's benchmarks/Cargo.lock"
              exit 1
            fi
          done
          if [ "$base_version" = "$head_version" ]; then
            echo "compare=true" >> "$GITHUB_OUTPUT"
          else
            echo "compare=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iai-callgrind changes from ${base_version} to ${head_version} in this PR, so its instruction counts cannot be compared with the base branch. The benchmarks run without a comparison."
          fi

      - name: Benchmark the base branch
        # Runs in place, in the same benchmarks/target the PR's run uses next,
        # because iai-callgrind looks for the baseline beside its own output. A
        # second checkout with its own target directory would leave the PR's
        # run with nothing to compare against.
        #
        # `record` lists what the base produced, for the check further down,
        # and runs from the PR's checkout because the base may not have it.
        id: base
        if: steps.version.outputs.compare == 'true'
        shell: bash
        run: |
          head_sha=$(git rev-parse HEAD)
          git checkout --quiet --detach HEAD^1
          (cd benchmarks && cargo bench --bench iai_core --features iai-callgrind -- --save-baseline=base --save-summary=json)
          git checkout --quiet --detach "$head_sha"
          python3 benchmarks/scripts/check_iai_baselines.py record \
            --iai-dir benchmarks/target/iai \
            --output benchmarks/iai_base_benchmarks.txt

      - name: Benchmark the PR against the base
        # The limit is 4% more instructions than the base, per benchmark. The
        # counts are not exactly repeatable from one process to the next (std's
        # HashMap, for one, seeds itself per process). Across 16 runs of
        # unchanged code in an arm64 Linux container, get_item moved by up to
        # 2.7% and every other benchmark by 1.1% or less; the x86 runner's
        # spread is still to be confirmed by the first runs here. 4% stays
        # clear of that and still catches a regression like the 5.9% one this
        # job once missed. iai-callgrind exits 3 when a benchmark breaches it,
        # and lists the breaches under "Regressions" at the end of the log.
        #
        # Without a base run (see the version step) the benchmarks run on
        # their own, so the numbers are still in the log.
        #
        # pipefail (from shell: bash) keeps cargo's exit status rather than
        # tee's.
        shell: bash
        env:
          COMPARE: ${{ steps.version.outputs.compare }}
        run: |
          args=()
          if [ "$COMPARE" = "true" ]; then
            args=(--baseline=base --regression='ir=4.0' --save-summary=json)
          fi
          set +e
          (cd benchmarks && cargo bench --bench iai_core --features iai-callgrind -- "${args[@]}" 2>&1 | tee iai_output.txt)
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "::error::Instruction count rose more than 4% over the base branch; see Regressions in the log"
          elif [ "$status" -ne 0 ]; then
            echo "::error::iai-callgrind run failed (exit $status)"
          fi
          exit "$status"

      - name: Check every benchmark had a baseline
        # iai-callgrind prints N/A and carries on when it finds no baseline,
        # which reads as a pass. Fail instead when a benchmark the base ran has
        # no old count. One only the PR has is reported as new and allowed,
        # and one only the base has is reported as removed.
        # Runs after a regression too, so both problems show in one go, and
        # is skipped with the base run when there is nothing to compare.
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: |
          python3 benchmarks/scripts/check_iai_baselines.py check \
            --iai-dir benchmarks/target/iai \
            --base-list benchmarks/iai_base_benchmarks.txt
