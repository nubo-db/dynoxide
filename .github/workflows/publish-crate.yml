name: Publish to crates.io
# Manual recovery workflow. The primary release path is release.yml
# (triggered by a v* tag push). Use this only to re-run a crate publish
# in isolation when the main pipeline has partially failed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.6)"
        required: true
        type: string

concurrency:
  group: publish-crate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Manual dispatch publishes to crates.io exactly as a tagged release does,
    # so it takes the same approval gate. Without this the recovery path is a
    # way to publish with no review.
    environment: production-publish

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      # Recovery is run by hand against a tag, so the crate version it finds
      # may already be published. Say so and stop, rather than failing on a
      # cargo error that reads like something went wrong.
      - name: Is this crate version already published
        run: |
          CRATE=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                   -H 'User-Agent: dynoxide-release' \
                   "https://crates.io/api/v1/crates/dynoxide-rs/$CRATE" || echo "000")
          if [ "$CODE" = "200" ]; then
            echo "::error::dynoxide-rs $CRATE is already on crates.io. Nothing to recover."
            exit 1
          fi
          if [ "$CODE" != "404" ]; then
            echo "::error::could not reach crates.io (status $CODE). Refusing to guess."
            exit 1
          fi
          echo "dynoxide-rs $CRATE is not published; continuing"

      - name: Dry run
        run: cargo publish --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
