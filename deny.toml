# cargo-deny configuration. Run with `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Advisories are denied by default and nothing is ignored. Keep it that way:
# an entry here is a hole held open, so prefer a version bump, and record the
# reason and the condition for removal if one is ever genuinely unavoidable.
#
# RUSTSEC-2026-0009 (`time`, stack exhaustion on a hostile RFC 2822 date) sat
# here while the fix in 0.3.47 needed Rust 1.88 and the crate declared 1.85.
# The declared MSRV is now 1.88, so `time` moved to a fixed version and the
# ignore went with it.
ignore = []

[licenses]
# Mirrors about.toml's accepted set, plus MPL-2.0 for option-ext (a normal
# transitive dep via the dirs / directories family). MPL-2.0 is weak copyleft
# and standard to allow for a permissively-licensed binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]
# A few allowed licences (ISC, OpenSSL, MIT-0, CC0-1.0) are only reachable under
# certain feature combinations; keep them for about.toml parity without warning
# when the current graph does not use them.
unused-allowed-license = "allow"

[bans]
# The TLS transition leaves duplicate major versions in the tree (rustls 0.21
# and 0.23, rustls-webpki 0.101 and 0.103); allow duplicates rather than fail.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
