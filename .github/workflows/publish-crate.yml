name: Publish to crates.io
# Manual recovery workflow. The primary release path is release.yml
# (triggered by a v* tag push). Use this only to re-run a crate publish
# in isolation when the main pipeline has partially failed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.6)"
        required: true
        type: string

concurrency:
  group: publish-crate
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Manual dispatch publishes to crates.io exactly as a tagged release does,
    # so it takes the same approval gate. Without this the recovery path is a
    # way to publish with no review.
    environment: production-publish

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      # Recovery is run by hand against a tag, so the crate version it finds
      # may already be published. Say so and stop, rather than failing on a
      # cargo error that reads like something went wrong. The probe is the
      # script release.yml uses, so the two paths cannot drift.
      - name: Is this crate version already published
        run: |
          CRATE=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          ALREADY=$(scripts/is-crate-published.sh dynoxide-rs "$CRATE") || {
            echo "::error::could not determine whether dynoxide-rs $CRATE is published. Refusing to guess."
            exit 1
          }
          if [ "$ALREADY" = true ]; then
            echo "::error::dynoxide-rs $CRATE is already on crates.io. Nothing to recover."
            exit 1
          fi
          echo "dynoxide-rs $CRATE is not published; continuing"

      # Trusted Publishing, as release.yml uses. crates.io matches the
      # exchange on the workflow filename, so this recovery path needs its own
      # config on crates.io naming publish-crate.yml; the one for release.yml
      # will not cover it.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Dry run
        run: cargo publish --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
