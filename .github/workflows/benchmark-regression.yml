name: Benchmark Regression Check

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  criterion-benchmarks:
    runs-on: ubuntu-latest
    # Skip for PRs from forks so external contributors can't auto-trigger
    # benchmarks. First-party branches only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            benchmarks

      - name: Run criterion micro-benchmarks
        run: cd benchmarks && cargo bench --bench embedded_micro -- --output-format bencher | tee criterion_output.txt

      - name: Compare against recent baselines
        id: compare
        run: |
          git fetch origin benchmark-data:benchmark-data 2>/dev/null || true

          set +e
          python3 benchmarks/scripts/compare_criterion.py \
            --current-output benchmarks/criterion_output.txt \
            --output comparison.md
          status=$?
          set -e

          # 3 means something exceeded the threshold, which is advisory here.
          # Anything else non-zero means the comparison could not be made, and
          # a check that could not run must not read as a check that passed.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "::error::criterion comparison failed (exit $status)"
            exit "$status"
          fi

          if [ "$status" -eq 3 ]; then
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          else
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post comparison to the PR
        uses: actions/github-script@v8
        env:
          REGRESSED: ${{ steps.compare.outputs.regressed }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comparison.md', 'utf8');

            // GITHUB_STEP_SUMMARY is always visible in the Actions tab
            await core.summary.addRaw(body).write();

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

            // Wall-clock regressions are advisory only -- don't block merge
            if (process.env.REGRESSED === 'true') {
              core.warning('Wall-clock regression detected -- see PR comment for details');
            }

  iai-benchmarks:
    runs-on: ubuntu-latest
    # Skip for PRs from forks so external contributors can't auto-trigger
    # benchmarks. First-party branches only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            benchmarks

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Install iai-callgrind-runner
        run: |
          IAI_VERSION=$(cd benchmarks && cargo metadata --format-version=1 --no-deps | python3 -c "
          import json, sys
          meta = json.load(sys.stdin)
          for pkg in meta['packages']:
              for dep in pkg.get('dependencies', []):
                  if dep['name'] == 'iai-callgrind':
                      req = dep['req']
                      if not req.startswith(('^', '~', '=')):
                          req = '^' + req
                      print(req)
                      sys.exit(0)
          print('^0.14')
          ")
          cargo install iai-callgrind-runner --version "${IAI_VERSION}"

      - name: Run iai-callgrind benchmarks
        run: cd benchmarks && cargo bench --bench iai_core --features iai-callgrind 2>&1 | tee iai_output.txt

      - name: Check for instruction-count regressions
        run: |
          if grep -q "Performance has regressed" benchmarks/iai_output.txt; then
            echo "::error::Instruction-count regression detected in iai-callgrind benchmarks"
            grep "Performance has regressed" benchmarks/iai_output.txt
            exit 1
          else
            echo "No iai-callgrind regressions detected"
          fi
