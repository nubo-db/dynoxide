[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dynoxide"
dynamic = ["version"]
description = "A DynamoDB emulator for tests and local development: starts a Dynoxide server from Python or pytest, binary included."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Martin Hicks" }]
keywords = ["dynamodb", "dynamodb-local", "emulator", "testing", "pytest", "aws", "boto3", "sqlite"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://dynoxide.dev"
Documentation = "https://dynoxide.dev/docs/"
Source = "https://github.com/nubo-db/dynoxide/tree/main/python"
Issues = "https://github.com/nubo-db/dynoxide/issues"

[project.scripts]
dynoxide = "dynoxide.__main__:main"

[project.entry-points.pytest11]
dynoxide = "dynoxide.pytest_plugin"

[dependency-groups]
dev = [
  "boto3>=1.28.0",
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-xdist>=3.6",
  "ruff>=0.8",
]

[tool.hatch.version]
path = "src/dynoxide/_version.py"

# The binary is added per platform by scripts/build_wheels.py. A local copy
# under _bin never goes into a build.
[tool.hatch.build.targets.wheel]
packages = ["src/dynoxide"]
exclude = ["src/dynoxide/_bin"]

[tool.hatch.build.targets.sdist]
include = ["src/dynoxide", "tests", "scripts", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
exclude = ["src/dynoxide/_bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "pytester"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "scripts"]
